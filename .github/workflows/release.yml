# Release pipeline for WAIncognito.
#
#   push tag `v*`      -> release exactly that version, no further questions asked
#   workflow_dispatch  -> full manual control (version override, targets, draft, ...)
#
# The two entry points converge on a single `resolve` job that produces one set of
# job outputs, so every downstream job reads identical values. Nothing downstream
# re-derives a version from a second source; that is how "the zip says 2.5.7 but the
# AppImage says 2.5.6" happens.
#
# Gate order is deliberate: resolve (validate) -> verify (build+assert+test) ->
# build (per-platform) -> publish. A release is only ever created from artefacts that
# passed the same gate CI runs on a PR.

name: Release

on:
  push:
    tags: ['v*']

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.5.7 (blank = use manifest.json)'
        required: false
        type: string
      tag:
        description: 'Tag for the release (blank = v<version>)'
        required: false
        type: string
      targets:
        description: 'Which artefacts to build'
        required: false
        default: all
        type: choice
        options: [all, extension, electron]
      bump_manifest:
        description: 'Rewrite manifest.json + package.json to <version> and commit to master'
        required: false
        default: false
        type: boolean
      create_tag:
        description: 'Create and push the tag if it does not exist yet'
        required: false
        default: true
        type: boolean
      draft:
        description: 'Publish as a draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark the release as a prerelease'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Build and verify everything, but do not publish a release'
        required: false
        default: false
        type: boolean
      force:
        description: 'Skip the tag/version consistency check'
        required: false
        default: false
        type: boolean
      notes:
        description: 'Release notes (blank = auto-generated from commits)'
        required: false
        type: string

# One release per tag. A second run against the same tag is a mistake, not a
# parallel job, so queue it instead of racing the first one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  # ---------------------------------------------------------------------------
  # Single source of truth for version / tag / flags. Also the only place that
  # writes back to the repository (the manifest bump).
  # ---------------------------------------------------------------------------
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      targets: ${{ steps.plan.outputs.targets }}
      draft: ${{ steps.plan.outputs.draft }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      notes: ${{ steps.plan.outputs.notes }}
      from_tag: ${{ steps.plan.outputs.from_tag }}
      bump: ${{ steps.plan.outputs.bump }}
      create_tag: ${{ steps.plan.outputs.create_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the tag comparison below can resolve an existing tag.
          # `ref` is left at its default on purpose: checkout already handles both
          # cases (the tag for a push, the selected branch for a dispatch), and
          # overriding it risks disagreeing with github.sha for annotated tags.
          fetch-depth: 0

      - name: Resolve version, tag and flags
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          IN_TARGETS: ${{ inputs.targets }}
          IN_BUMP: ${{ inputs.bump_manifest }}
          IN_CREATE_TAG: ${{ inputs.create_tag }}
          IN_DRAFT: ${{ inputs.draft }}
          IN_PRERELEASE: ${{ inputs.prerelease }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_FORCE: ${{ inputs.force }}
          IN_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail

          is_true() { case "${1,,}" in true|1|yes|on) return 0 ;; *) return 1 ;; esac; }
          say() { echo "::notice::$*"; }

          # Accept "v2.5.7", " 2.5.7 " and "2.5.7" alike. Applied to the version only:
          # a tag is never rewritten, because on a tag push it is a git object that
          # already exists and the release has to reference it verbatim.
          denoise() { printf '%s' "$1" | tr -d '[:space:]'; }
          strip_v() { local v; v="$(denoise "$1")"; printf '%s' "${v#v}"; }
          # Surrounding whitespace only. A tag pasted with a trailing space is a typo
          # worth absorbing; whitespace *inside* one is rejected below rather than
          # deleted, because silently retagging "release 2.5.6" as "release2.5.6"
          # publishes something the user did not ask for.
          trim() {
            local v="$1"
            v="${v#"${v%%[![:space:]]*}"}"
            printf '%s' "${v%"${v##*[![:space:]]}"}"
          }

          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          PKG_VERSION=$(node -p "require('./package.json').version")

          FROM_TAG=false
          if [ "$EVENT_NAME" = "push" ]; then
            FROM_TAG=true
            TAG="$REF_NAME"
            VERSION="$(strip_v "$REF_NAME")"
            if [ -n "$IN_VERSION" ]; then
              echo "::error::the 'version' input is ignored for tag pushes - the tag already names a version. Use workflow_dispatch to override."
              exit 1
            fi
            DRY_RUN=false
            BUMP=false
            CREATE_TAG=false
            DRAFT=false
            PRERELEASE=false
            TARGETS=all
            FORCE=false
          else
            # Normalise the version BEFORE deriving the tag, or "v2.5.7" yields "vv2.5.7".
            VERSION="$(strip_v "${IN_VERSION:-$MANIFEST_VERSION}")"
            TAG="$(trim "$IN_TAG")"
            [ -n "$TAG" ] || TAG="v$VERSION"
            TARGETS="${IN_TARGETS:-all}"
            BUMP=$(is_true "$IN_BUMP" && echo true || echo false)
            CREATE_TAG=$(is_true "$IN_CREATE_TAG" && echo true || echo false)
            DRAFT=$(is_true "$IN_DRAFT" && echo true || echo false)
            PRERELEASE=$(is_true "$IN_PRERELEASE" && echo true || echo false)
            DRY_RUN=$(is_true "$IN_DRY_RUN" && echo true || echo false)
            FORCE=$(is_true "$IN_FORCE" && echo true || echo false)
          fi

          # Both checks use bash's own regex rather than grep: grep is line-oriented,
          # so it would validate only the first line of a value containing a newline
          # and wave through "v1\nrm -rf /".
          #
          # printf %q for the error text: a rejected value can contain control
          # characters, and an unescaped newline would split the ::error:: annotation
          # into two and lose the message.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            printf '::error::%s is not a valid semver version.\n' "$(printf '%q' "$VERSION")"
            exit 1
          fi

          # The tag reaches git commands and later run blocks, so it gets the same
          # treatment as a shell input, not just a display string. This is git's ref
          # rule: no spaces, no control characters, and none of ~ ^ : ? * [ \
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            printf '::error::%s is not a usable git tag. Use letters, digits, dot, underscore, slash or hyphen.\n' "$(printf '%q' "$TAG")"
            exit 1
          fi

          if [ "$MANIFEST_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::version skew in the repo: manifest.json=$MANIFEST_VERSION package.json=$PKG_VERSION. Fix the skew before releasing."
            exit 1
          fi

          if [ "$VERSION" != "$MANIFEST_VERSION" ] && [ "$FORCE" != true ] && [ "$BUMP" != true ]; then
            echo "::error::requested version $VERSION != manifest.json $MANIFEST_VERSION."
            echo "::error::Either set bump_manifest=true (updates manifest.json + package.json), or force=true to release $VERSION as-is."
            exit 1
          fi

          say "version=$VERSION tag=$TAG targets=$TARGETS dry_run=$DRY_RUN draft=$DRAFT prerelease=$PRERELEASE"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "targets=$TARGETS"
            echo "dry_run=$DRY_RUN"
            echo "draft=$DRAFT"
            echo "prerelease=$PRERELEASE"
            echo "from_tag=$FROM_TAG"
            echo "bump=$BUMP"
            echo "create_tag=$CREATE_TAG"
            # Release notes are routinely multi-line, and a bare `notes=$value` would
            # spill the extra lines into GITHUB_OUTPUT as separate, invalid entries.
            # The heredoc form is the only way to carry a multi-line job output.
            if [ -n "${IN_NOTES:-}" ]; then
              echo "notes<<WAI_NOTES_EOF"
              printf '%s\n' "$IN_NOTES"
              echo "WAI_NOTES_EOF"
            else
              echo "notes="
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Bump version in manifest.json and package.json
        # Only meaningful on a manual run, and only safe from master: the commit goes
        # back to the branch that the release is cutting from.
        if: needs.resolve.outputs.bump == 'true' && needs.resolve.outputs.dry_run == 'false'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail

          if [ "$VERSION" = "$(node -p "require('./manifest.json').version")" ]; then
            echo "manifest.json is already at $VERSION; nothing to bump"
            exit 0
          fi

          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::bump_manifest only runs from master (this run is on $GITHUB_REF_NAME). Merge to master first, or release without bumping."
            exit 1
          fi

          # Surgical replacement, not a re-serialisation. JSON.stringify(j, null, 2)
          # reflows every line of these hand-formatted files, which would bury a
          # one-line version change in a whole-file rewrite.
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            for (const f of ["manifest.json", "package.json"]) {
              const raw = fs.readFileSync(f, "utf8");
              // Anchored to the start of a line and a quoted value, so a nested
              // "version" key elsewhere in the file cannot be matched by mistake.
              const re = /^([ \t]*)"version"[ \t]*:[ \t]*"[^"]*"/m;
              const m = re.exec(raw);
              if (!m) throw new Error(`${f}: no "version" field found`);
              // The indent comes from the match, not a "$1" backreference: the
              // replacer is a function, where $1 would be a literal dollar-one.
              const indent = m[1];
              const next = raw.replace(re, () => `${indent}"version": ${JSON.stringify(v)}`);
              // Proves the *top-level* version is the one that moved.
              if (JSON.parse(next).version !== v) {
                throw new Error(`${f}: version did not change to ${v}`);
              }
              fs.writeFileSync(f, next);
            }
          '

          # Exactly one changed line per file, or the bump touched something it had
          # no business touching. Plain bash arithmetic: the awk one-liner this
          # replaces is mis-parsed by mawk, which is what Ubuntu runners ship.
          FILES=0; ADDED=0; REMOVED=0
          while read -r a d f; do
            [ -n "$f" ] || continue
            FILES=$((FILES + 1)); ADDED=$((ADDED + a)); REMOVED=$((REMOVED + d))
          done <<< "$(git diff --numstat -- manifest.json package.json)"

          if [ "$FILES" -ne 2 ] || [ "$ADDED" -ne 2 ] || [ "$REMOVED" -ne 2 ]; then
            echo "::error::expected a 1-line version swap in each of manifest.json and package.json, got files=$FILES +$ADDED -$REMOVED"
            git diff
            exit 1
          fi
          git diff --stat

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json package.json
          git commit -m "chore: release v$VERSION" -m "[skip ci]"
          git push origin "HEAD:$GITHUB_REF"
          echo "::notice::committed the bump to $GITHUB_REF_NAME and pushed it"

      - name: Ensure the tag exists
        if: needs.resolve.outputs.create_tag == 'true' && needs.resolve.outputs.dry_run == 'false'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --tags --force --quiet

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # Compare against HEAD, which after a bump is the bump commit. $GITHUB_SHA
            # is ambiguous for annotated tags, so it is not trusted here.
            EXISTING=$(git rev-list -n1 "$TAG")
            HEAD_SHA=$(git rev-parse HEAD)
            if [ "$EXISTING" != "$HEAD_SHA" ]; then
              echo "::error::tag $TAG already points at $EXISTING, not this commit ($HEAD_SHA). Delete it first, or pick another tag."
              exit 1
            fi
            echo "tag $TAG already exists at this commit; reusing it"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "WAIncognito $TAG"
          git push origin "refs/tags/$TAG"
          echo "created and pushed $TAG"

  # ---------------------------------------------------------------------------
  # The CI gate, repeated. A tag is not a licence to skip verification.
  # ---------------------------------------------------------------------------
  verify:
    name: verify
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all targets
        run: pnpm run build

      - name: Verify bundles
        run: pnpm run verify

      - name: Unit tests
        run: pnpm test

  # ---------------------------------------------------------------------------
  # Extension zips. We zip the build output (dist/extension/<browser>), which
  # build.mjs already derived from manifest.json, rather than the repo root. The old
  # `mv !(release|.github)` approach shipped app/, scripts/ and docs/ to users; zipping
  # a build target cannot leak anything, and cannot drift from what verify-bundles
  # checked.
  # ---------------------------------------------------------------------------
  build-extension:
    name: build extension (${{ matrix.browser }})
    needs: [resolve, verify]
    if: needs.resolve.outputs.targets == 'all' || needs.resolve.outputs.targets == 'extension'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - uses: actions/checkout@v4

      - name: Build extension
        env:
          BROWSER: ${{ matrix.browser }}
        run: node scripts/build.mjs --target="$BROWSER"

      - name: Package zip
        env:
          BROWSER: ${{ matrix.browser }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail

          SRC="dist/extension/$BROWSER"
          if [ ! -f "$SRC/manifest.json" ]; then
            echo "::error::$SRC/manifest.json is missing; the build produced no loadable extension."
            exit 1
          fi

          OUT="artifacts/WAIncognito-$VERSION-$BROWSER.zip"
          mkdir -p artifacts

          # Reproducible bytes: zip embeds file mtimes, so normalise them to the commit
          # date and pin the timezone. Without this, rebuilding the same commit produces
          # a different checksum and "did the artefact change?" is unanswerable.
          EPOCH="$(git log -1 --format=%ct)"
          find "$SRC" -exec touch -d "@$EPOCH" {} +

          # Sorted input plus a pinned mtime means the same commit always produces a
          # byte-identical zip.
          ( cd "$SRC" \
            && find . -type f -print0 \
               | LC_ALL=C sort -z \
               | TZ=UTC xargs -0 zip -X -9 -q "$GITHUB_WORKSPACE/$OUT" )

          echo "packed $(unzip -l "$OUT" | tail -1 | awk '{print $2}') files into $OUT"
          sha256sum "$OUT"
          ls -l "$OUT"

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.browser }}
          path: artifacts/*.zip
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Desktop installers, one runner per platform/arch.
  # ---------------------------------------------------------------------------
  build-electron:
    name: build electron (${{ matrix.name }})
    needs: [resolve, verify]
    if: needs.resolve.outputs.targets == 'all' || needs.resolve.outputs.targets == 'electron'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-latest, args: --linux --x64 }
          - { name: windows-x64, os: windows-latest, args: --win --x64, cert: WIN_CSC_LINK, pass: WIN_CSC_PASSWORD }
          - { name: macos-x64,   os: macos-13, args: --mac --x64, cert: MAC_CSC_LINK, pass: MAC_CSC_PASSWORD, notarize: true }
          - { name: macos-arm64, os: macos-14, args: --mac --arm64, cert: MAC_CSC_LINK, pass: MAC_CSC_PASSWORD, notarize: true }

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Restore electron-builder cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_CACHE }},${{ env.ELECTRON_BUILDER_CACHE }}
          key: eb-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: eb-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install the signing certificate
        # Inert when the secret is absent: the build falls through to unsigned, which
        # is the current behaviour. electron-builder reads CSC_LINK and
        # CSC_KEY_PASSWORD from the environment, so this needs no package.json change.
        #
        # macOS and Windows use *different* secrets because CSC_LINK is a single
        # variable: pointing both at one P12 would sign the .exe with the Apple
        # identity. The per-platform secret name comes from the matrix.
        if: matrix.cert != ''
        shell: bash
        # Matrix values arrive as env vars rather than being interpolated into the
        # script: a `${{ }}` expanded inside `run:` is a shell-injection surface, and
        # it also makes the step impossible to exercise outside a runner.
        env:
          MATRIX_NAME: ${{ matrix.name }}
          CERT_SECRET: ${{ matrix.cert }}
          B64: ${{ secrets[matrix.cert] }}
          PW: ${{ secrets[matrix.pass] }}
        run: |
          set -euo pipefail
          if [ -z "$B64" ]; then
            echo "::notice::$CERT_SECRET is unset - building $MATRIX_NAME unsigned."
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          DEST="$RUNNER_TEMP/ci-cert.p12"
          # Decoded with node, not base64: the GNU and BSD base64 flags disagree
          # (-d/-D/-o) and this step has to work on every runner in the matrix.
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.B64, "base64"))' "$DEST"
          if [ ! -s "$DEST" ]; then
            echo "::error::$CERT_SECRET did not decode to a non-empty file. Is it base64 of a raw .p12?"
            exit 1
          fi
          echo "CSC_LINK=$DEST" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "SIGNED=true" >> "$GITHUB_ENV"
          echo "::notice::signing $MATRIX_NAME with $CERT_SECRET"

      - name: Set up macOS notarisation
        # electron-builder notarises when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
        # APPLE_TEAM_ID are all present. Each is checked separately so a
        # half-configured secret set is reported rather than silently skipped.
        if: matrix.notarize
        shell: bash
        env:
          ID: ${{ secrets.APPLE_ID }}
          PW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "$ID" ]   || MISSING="$MISSING APPLE_ID"
          [ -n "$PW" ]   || MISSING="$MISSING APPLE_APP_SPECIFIC_PASSWORD"
          [ -n "$TEAM" ] || MISSING="$MISSING APPLE_TEAM_ID"
          if [ -n "$MISSING" ]; then
            echo "::notice::notarisation skipped - unset:$MISSING. The .dmg will be signed but not notarised."
            echo "NOTARIZED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "APPLE_ID=$ID" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$TEAM" >> "$GITHUB_ENV"
          echo "NOTARIZED=true" >> "$GITHUB_ENV"
          echo "::notice::notarisation enabled for team $TEAM"

      - name: Build electron target
        run: pnpm run build:electron

      - name: Package
        env:
          # Only consulted when CSC_LINK is unset. With a certificate installed,
          # electron-builder uses that and never reaches auto-discovery.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          EB_ARGS: ${{ matrix.args }}
        # --publish never: electron-builder must never try to reach a release
        # provider. This job uploads artefacts; the publish job owns the release.
        run: pnpm exec electron-builder $EB_ARGS --publish never

      - name: Record signing status
        # An unsigned artefact that looks identical to a signed one is the failure
        # mode this prevents: say it plainly on the run page.
        if: always()
        shell: bash
        env:
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          {
            echo "### $MATRIX_NAME"
            echo ""
            echo "- signed: \`${SIGNED:-false}\`"
            echo "- notarised: \`${NOTARIZED:-false}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${SIGNED:-false}" != "true" ] && [ "$MATRIX_NAME" != "linux-x64" ]; then
            echo "::warning::$MATRIX_NAME is UNSIGNED. Expect a Gatekeeper/SmartScreen prompt."
          fi

      - name: Collect installers
        shell: bash
        env:
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          # Dedupe into a per-platform directory so four runners can hand their
          # artefacts to one publish job without filename collisions.
          mkdir -p "artifacts/$MATRIX_NAME"
          find release -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.zip' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.blockmap' -o -name '*.yml' \) \
            -exec cp {} "artifacts/$MATRIX_NAME/" \;
          if [ -z "$(ls -A "artifacts/$MATRIX_NAME")" ]; then
            echo "::error::electron-builder produced no installers for $MATRIX_NAME."
            ls -la release || true
            exit 1
          fi
          ls -l "artifacts/$MATRIX_NAME"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.name }}
          path: artifacts/**
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish. The explicit result check is required: a skipped build job (because
  # targets=extension) would otherwise skip the whole publish chain.
  # ---------------------------------------------------------------------------
  publish:
    name: publish
    needs: [resolve, verify, build-extension, build-electron]
    if: >-
      always()
      && needs.resolve.result == 'success'
      && needs.verify.result == 'success'
      && (needs.build-extension.result == 'success' || needs.build-extension.result == 'skipped')
      && (needs.build-electron.result == 'success' || needs.build-electron.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download build artefacts
        uses: actions/download-artifact@v4
        with:
          pattern: |
            extension-*
            electron-*
          path: artifacts
          merge-multiple: true

      - name: List artefacts
        run: |
          set -euo pipefail
          find artifacts -type f -printf '%10s  %p\n' | sort -k2
          COUNT=$(find artifacts -type f | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::no artefacts were produced; refusing to publish an empty release."
            exit 1
          fi

      - name: Dry run summary
        if: needs.resolve.outputs.dry_run == 'true'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          {
            echo "### Dry run - nothing was published"
            echo ""
            echo "Would release \`$TAG\` with:"
            echo ""
            find artifacts -type f -printf -- '- `%p` (%s bytes)\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"
          echo "dry_run=true: artefacts verified and uploaded, release not created"

      - name: Create release
        if: needs.resolve.outputs.dry_run == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: WAIncognito ${{ needs.resolve.outputs.tag }}
          body: ${{ needs.resolve.outputs.notes || '' }}
          draft: ${{ needs.resolve.outputs.draft }}
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          generate_release_notes: ${{ needs.resolve.outputs.notes == '' }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.blockmap
          fail_on_unmatched_files: false

      - name: Release summary
        if: always() && needs.resolve.outputs.dry_run == 'false'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          DRAFT: ${{ needs.resolve.outputs.draft }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "### Release \`$TAG\`"
            echo ""
            echo "- draft: \`$DRAFT\`"
            echo "- prerelease: \`$PRERELEASE\`"
            echo "- triggered by: \`$EVENT\`"
            echo ""
            find artifacts -type f -printf -- '- `%p`\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"
